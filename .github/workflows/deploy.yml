name: Deploy Random Duty

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to radtools.tsai.it

    steps:
      - name: Checkout random-duty
        uses: actions/checkout@v7

      - name: Verify Version Consistency
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER=${GITHUB_REF_NAME#v}
          echo "Checking version consistency: package.json ($PKG_VER) vs Git Tag ($TAG_VER)"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "❌ 錯誤：Git Tag ($TAG_VER) 與 package.json ($PKG_VER) 不一致！"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

      - name: Build Project
        run: pnpm build

      - name: Checkout radtools.tsai.it
        uses: actions/checkout@v7
        with:
          repository: tsaiid/radtools.tsai.it
          token: ${{ secrets.DEPLOY_KEY }}
          path: radtools-repo

      - name: Sync dist to radtools.tsai.it
        run: |
          TARGET_DIR="radtools-repo/random-duty"
          mkdir -p "$TARGET_DIR"
          rsync -av --delete --exclude '.git' --exclude 'ver' --exclude 'legacy' dist/ "$TARGET_DIR/"

      - name: Commit and Push Changes
        run: |
          cd radtools-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add random-duty
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping push."
          else
            git commit -m "Deploy random-duty ${GITHUB_REF_NAME}"
            git push
            echo "✅ Successfully deployed to radtools.tsai.it!"
          fi

      - name: Archive production artifacts
        run: zip -r dist.zip dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist.zip
          generate_release_notes: true
